<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빼빼로데이 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: a Korean 수능-style exam sheet on a desk — header band with 교시/영역, two-column question grid split by a hairline, red-pen grading on top. */
:root{
  --desk:#e7e1e3;
  --paper:#fffefb;
  --ink:#1c1819;
  --ink-2:#5d5457;
  --rule:#2a2426;
  --faint:#d9d1d3;
  --red:#d3202b;
  --red-soft:#fbe3e4;
  --choco:#5a3021;
  --biscuit:#e2b27a;
  --pink:#f5c9d2;
  --ok:#1f7a4a;
  --bar:#231d1f;
  --bar-fg:#f6efef;
  --f-display:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#121011;--paper:#1f1b1c;--ink:#efe8e6;--ink-2:#b2a8aa;--rule:#d8cfcf;--faint:#3a3335;
  --red:#ff5d63;--red-soft:#3d1f22;--choco:#c98a63;--biscuit:#9c7448;--pink:#5a2f39;--ok:#5fcf93;
  --bar:#0b0909;--bar-fg:#f6efef;color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#121011;--paper:#1f1b1c;--ink:#efe8e6;--ink-2:#b2a8aa;--rule:#d8cfcf;--faint:#3a3335;
  --red:#ff5d63;--red-soft:#3d1f22;--choco:#c98a63;--biscuit:#9c7448;--pink:#5a2f39;--ok:#5fcf93;
  --bar:#0b0909;--bar-fg:#f6efef;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- proctor bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
#hostbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-width:960px;margin:0 auto;padding-top:12px}
.bar{background:var(--bar);color:var(--bar-fg);font-family:var(--f-ui);font-size:14px;border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
.bar .who{font-weight:600;letter-spacing:.04em;font-size:12px;opacity:.75}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{background:transparent;color:inherit;font:inherit;cursor:pointer;padding:3px 10px;border-radius:99px;font-size:12.5px;border:1px solid rgb(255 255 255 / .2);opacity:.55}
.step.now{opacity:1;background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.step.done{opacity:.85}
.step:not(:disabled):hover{opacity:1;border-color:#fff}
.step:disabled{cursor:default}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.bbtn{border:1px solid rgb(255 255 255 / .28);background:transparent;color:var(--bar-fg);border-radius:7px;padding:7px 12px;font-size:13.5px;font-weight:500}
.bbtn.main{background:#fff;color:#1c1819;border-color:#fff;font-weight:600}
.bbtn.danger{border-color:#ff7b80;color:#ffb3b6}
.bbtn:disabled{opacity:.4;cursor:not-allowed}
.bar .msg{flex-basis:100%;font-size:13px;color:#ffc6c9;margin:0}
.bar .msg:empty{display:none}
.roster{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.roster .chip{background:rgb(255 255 255 / .09);border-radius:6px;padding:2px 8px}
.roster .chip b{font-weight:600}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:0;color:var(--bar-fg);opacity:.6;padding:4px 8px;border-bottom:2px solid transparent;font-size:13.5px}
.tab.on{opacity:1;border-bottom-color:var(--red)}

/* ---------- sheet ---------- */
.sheet{max-width:960px;margin:16px auto 0;background:var(--paper);border:1px solid var(--faint);box-shadow:0 1px 0 var(--faint),0 18px 40px -24px rgb(40 20 25 / .35);padding:28px clamp(16px,4vw,44px) 20px;position:relative}
.head-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.form-type{border:1.5px solid var(--rule);padding:2px 10px;font-weight:600;color:var(--ink);font-family:var(--f-display)}
.head-title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-top:3px double var(--rule);border-bottom:1.5px solid var(--rule);margin-top:8px;padding:14px 0}
.period{font-family:var(--f-display);font-weight:700;font-size:15px;border:1.5px solid var(--rule);border-radius:99px;padding:4px 14px;justify-self:start;white-space:nowrap}
.subject{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,46px);letter-spacing:.18em;text-align:center;text-wrap:balance;line-height:1.15}
.sticks{justify-self:end;display:flex;gap:7px;align-items:flex-end;transform:rotate(8deg)}
.stick{width:9px;height:56px;border-radius:5px;background:linear-gradient(to top,var(--biscuit) 0 22%,var(--choco) 22% 100%)}
.stick:nth-child(2){height:62px}
.head-meta{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:stretch;padding:14px 0 6px;font-family:var(--f-ui);font-size:13.5px}
.field{display:flex;align-items:center;border:1.5px solid var(--rule)}
.field>span{padding:6px 10px;border-right:1.5px solid var(--rule);font-weight:600;white-space:nowrap;align-self:stretch;display:flex;align-items:center}
.field input{border:0;background:transparent;font-family:var(--f-hand);font-size:26px;line-height:1;padding:4px 10px;width:180px;min-width:0}
.field input:disabled{opacity:1}
.field input::placeholder{color:var(--ink-2);opacity:.6}
.idbox{display:flex}
.idbox i{font-style:normal;width:26px;text-align:center;border-left:1px solid var(--faint);padding:6px 0;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:700}
.idbox i:first-child{border-left:0}
.scorebox{margin-left:auto;display:flex;align-items:center;gap:10px}
.scorebox .lbl{font-weight:600}
.score{font-family:var(--f-hand);color:var(--red);font-size:62px;line-height:.8;position:relative;padding:4px 14px 0}
.score::after{content:"";position:absolute;inset:-6px -2px -10px -4px;border:3px solid var(--red);border-radius:50% 46% 52% 44%;transform:rotate(-6deg)}
.score small{font-size:26px;margin-left:2px}
.status{font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2);padding:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status b{color:var(--red);font-weight:600}
.notice{font-family:var(--f-ui);font-size:13px;color:var(--ink-2);border:1px dashed var(--faint);padding:8px 12px;margin-top:10px}

/* ranking */
.ranking{margin-top:18px;border:1.5px solid var(--rule);font-family:var(--f-ui);font-size:14px}
.ranking h2{margin:0;font-family:var(--f-display);font-size:16px;padding:8px 12px;border-bottom:1.5px solid var(--rule);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.ranking h2 small{font-family:var(--f-ui);font-weight:400;color:var(--ink-2);font-size:12.5px}
.rank-wrap{overflow-x:auto;max-height:280px;overflow-y:auto}
.ranking table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ranking td,.ranking th{padding:6px 12px;border-bottom:1px solid var(--faint);text-align:left;white-space:nowrap}
.ranking th{font-weight:600;color:var(--ink-2);font-size:12.5px}
.ranking tr.sel td{background:var(--red-soft)}
.ranking .nm{font-family:var(--f-hand);font-size:22px;line-height:1}
.ranking .sc{color:var(--red);font-weight:600}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:13px}
.viewing{font-family:var(--f-ui);font-size:13.5px;margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.viewing select{border:1.5px solid var(--rule);background:var(--paper);padding:4px 8px}

/* questions */
.qs{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:22px}
@media (min-width:860px){.qs{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px;background:linear-gradient(var(--rule),var(--rule)) center top/1px 100% no-repeat}}
.q{position:relative;min-width:0}
.q-line{display:flex;gap:8px;align-items:baseline}
.q-num{font-family:var(--f-display);font-weight:800;font-size:19px;position:relative;flex:none;min-width:30px}
.q-text{font-size:16.5px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.pts{font-family:var(--f-ui);font-size:13px;white-space:nowrap}
.opts{list-style:none;margin:12px 0 0;padding:0 0 0 30px;display:grid;gap:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:4px;line-height:1.5}
.opt:not(:disabled):hover{background:var(--red-soft)}
.opt:disabled{cursor:default}
.circ{flex:none;width:22px;height:22px;border:1.4px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-size:12.5px;font-weight:600;margin-top:1px;position:relative}
.opt.on .circ{background:var(--ink);color:var(--paper)}
.opt.key .circ::after{content:"";position:absolute;inset:-6px;border:2.4px solid var(--red);border-radius:50% 44% 52% 47%;transform:rotate(-12deg)}
.opt .cnt{margin-left:auto;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding-left:8px}
.opt-txt{min-width:0;overflow-wrap:anywhere}

/* red pen marks */
.mark{position:absolute;pointer-events:none;color:var(--red)}
.mark.ok{left:-12px;top:-12px;width:54px;height:46px;border:3.5px solid var(--red);border-radius:50% 46% 52% 44%;transform:rotate(-10deg)}
.mark.no{left:-6px;top:-18px;width:40px;height:58px}
.mark.no::before{content:"";position:absolute;left:50%;top:0;width:4px;height:100%;background:var(--red);border-radius:2px;transform:rotate(38deg)}
.reveal .mark{animation:pen .45s cubic-bezier(.3,1.4,.6,1) both;animation-delay:calc(var(--i) * 140ms + 200ms)}
.reveal .score{animation:pen .6s cubic-bezier(.3,1.4,.6,1) both;animation-delay:calc(var(--n) * 140ms + 500ms)}
@keyframes pen{from{opacity:0;transform:scale(1.8) rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){.reveal .mark,.reveal .score{animation:none}}

/* game */
.game{margin:12px 0 0 30px;border:1.5px solid var(--rule);background:var(--paper)}
.game-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--faint)}
.game-head b{font-weight:600}
.game canvas{display:block;width:100%;height:210px;touch-action:none;background:var(--paper)}
.game-foot{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--faint);font-family:var(--f-ui);font-size:13px;flex-wrap:wrap}
.gbtn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:4px;font-weight:600;font-size:13px}
.gbtn.ghost{background:transparent;color:var(--ink)}
.gbtn:disabled{opacity:.4;cursor:not-allowed}
.game-res{font-family:var(--f-ui);font-size:13.5px;margin:10px 0 0 30px}

/* editor */
.ed-list{display:grid;gap:18px;margin-top:20px}
.ed{border:1.5px solid var(--rule);padding:14px;font-family:var(--f-ui);font-size:14px;display:grid;gap:10px;min-width:0}
.ed-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ed-top .no{font-family:var(--f-display);font-weight:800;font-size:19px;margin-right:4px}
.ed select,.ed input[type=number],.ed input[type=text],.ed textarea{border:1px solid var(--faint);background:var(--paper);padding:6px 8px;border-radius:3px;min-width:0}
.ed textarea{width:100%;resize:vertical;min-height:64px;font-family:var(--f-body);font-size:16px}
.ed input[type=number]{width:72px}
.ed .sp{margin-left:auto;display:flex;gap:6px}
.ibtn{border:1px solid var(--faint);background:transparent;border-radius:4px;padding:4px 9px;font-size:13px}
.ibtn.del{color:var(--red);border-color:var(--red)}
.ed-opt{display:flex;gap:8px;align-items:center}
.ed-opt input[type=text]{flex:1}
.ed-opt label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.ed-opt input[type=radio]{accent-color:var(--red);width:17px;height:17px}
.hint{color:var(--ink-2);font-size:12.5px}
.ed-add{border:1.5px dashed var(--rule);background:transparent;padding:14px;font-family:var(--f-ui);font-weight:600;width:100%}
.ed-sum{font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2);margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed-meta{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--f-ui);font-size:14px;margin-top:14px;align-items:center}
.ed-meta input{border:1px solid var(--faint);background:var(--paper);padding:6px 8px;min-width:0}
.example{font-family:var(--f-ui);font-size:12px;color:var(--red);border:1px solid var(--red);padding:1px 6px;border-radius:3px}

.empty{text-align:center;padding:60px 10px;font-family:var(--f-display)}
.empty p{color:var(--ink-2);font-family:var(--f-ui);font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;border-top:1.5px solid var(--rule);padding-top:10px;font-family:var(--f-ui);font-size:12px;color:var(--ink-2)}
.pageno{width:26px;height:26px;border:1.4px solid var(--rule);border-radius:50%;display:grid;place-items:center;color:var(--ink);font-weight:600}
@media (max-width:600px){
  .head-title{grid-template-columns:1fr auto}
  .sticks{display:none}
  .scorebox{margin-left:0}
  .opts,.game,.game-res{margin-left:0;padding-left:0}
}
.login{margin-top:22px;font-family:var(--f-ui);font-size:13px}
.login summary{cursor:pointer;color:var(--ink-2)}
.login form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.login input{border:1px solid var(--faint);background:var(--paper);padding:6px 8px;min-width:0;flex:1 1 160px}
.q-img{margin:12px 0 0 30px;border:1.5px solid var(--rule);background:var(--paper);padding:6px;display:inline-block;max-width:calc(100% - 30px);cursor:zoom-in}
.q-img img{display:block;max-width:100%;max-height:340px;width:auto;height:auto;margin:0 auto}
.q-img.wait{font-family:var(--f-ui);font-size:13px;color:var(--ink-2);padding:24px 18px;cursor:default}
.ed-img{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-img img{max-height:120px;max-width:200px;border:1px solid var(--faint);display:block}
.ed-img input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ed-img label.ibtn{cursor:pointer}
.sa{margin:12px 0 0 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.sa-line{display:flex;align-items:flex-end;gap:10px;border-bottom:1.5px solid var(--rule);padding-bottom:2px}
.sa-lbl{font-family:var(--f-ui);font-weight:600;font-size:14px;padding-bottom:6px}
.sa-in{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-hand);font-size:28px;line-height:1.2;padding:2px 0;color:var(--ink)}
.sa-in:disabled{opacity:1}
.sa-in::placeholder{font-family:var(--f-ui);font-size:14px;color:var(--ink-2);opacity:.7}
.sa-stat{font-family:var(--f-ui);font-size:14px;padding-bottom:6px}
.sa-key{font-family:var(--f-ui);font-size:13.5px;color:var(--red)}
.sa-key span{color:var(--ink-2)}
.ed-kw{display:flex;gap:8px;align-items:center}
.ed-kw input{flex:1}
@media (max-width:600px){.sa{margin-left:0}}
.opts.has-img{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.opts.has-img .opt{flex-direction:column;align-items:stretch;gap:6px;border:1px solid var(--faint);padding:8px;height:100%}
.opts.has-img .opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opts.has-img .opt-txt{display:grid;gap:4px;text-align:center}
.opts.has-img .cnt{margin-left:0;padding-left:0;text-align:center}
.opt-img{display:block;width:100%;height:120px;object-fit:contain;background:var(--paper)}
.opt-wait{font-family:var(--f-ui);font-size:12px;color:var(--ink-2);padding:30px 0}
.ed-oimg{height:44px;width:auto;max-width:80px;border:1px solid var(--faint)}
.ed-opt .ed-img{display:contents}
.lightbox{position:fixed;inset:0;z-index:50;background:rgb(10 8 9 / .86);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
@media (max-width:600px){.q-img{margin-left:0;max-width:100%}}
</style>

/* ---------------- boot ---------------- */
function normQuiz(d){
  if(!d) return null;
  const q={...d, questions:(d.questions||[]).filter(Boolean).map(x=>({...x, options: x.type==='choice' ? [0,1,2,3,4].map(k=>(x.options||[])[k]??'') : undefined}))};
  q.questions.forEach(x=>{
    if(x.options===undefined){ delete x.options; delete x.optImgs; }
    else x.optImgs=[0,1,2,3,4].map(k=>(x.optImgs||{})[k]||'');
  });
  return q;
}
function normEntries(src){ const m={}; for(const [id,e] of Object.entries(src||{})) m[id]={nick:e.nick||'',ans:e.ans||{},gm:e.gm||{},t:e.t||0, ...(e.score!==undefined?{score:e.score,marks:e.marks||{}}:{})}; return m; }

async function boot(){
  render();
  S.nick = ls.get('pp-nick') || '';
  try{ const a = JSON.parse(ls.get('pp-ans')||'null'); if(a){S.ans=a.ans||{}; S.gm=a.gm||{};} }catch(e){}
  if(firebaseConfig.apiKey.startsWith('YOUR')){
    S.local=true; S.isHost=true; S.me='preview-me'; S.quizLoaded=true; S.resLoaded=true; S.wasGraded=false;
    const s=sampleQuiz(); S.quiz=s.quiz; S.key=s.key; S.loading=false; render(); return;
  }
  const timer = setTimeout(()=>{ if(S.loading){S.slow=true;render();} }, 10000);
  const app=FB.initializeApp(firebaseConfig);
  const auth=FB.getAuth(app); const rdb=FB.getDatabase(app);
  S.auth=auth; S.rdb=rdb; S.db=true;
  let started=null;
  FB.onAuthStateChanged(auth, async u=>{
    if(!u){ try{ await FB.signInAnonymously(auth); }catch(e){ S.loading=false; S.fatal='익명 로그인이 꺼져 있어요. Firebase 콘솔 > Authentication에서 "익명"을 사용 설정해 주세요.'; render(); } return; }
    if(started && started!==u.uid){ location.reload(); return; }
    if(started) return; started=u.uid;
    S.me=u.uid; S.isHost=!u.isAnonymous; S.hostEmail=u.email||'';
    startListeners(timer);
  });
}
const R = p => FB.ref(S.rdb,p);
function startListeners(timer){
  let first=true;
  FB.onValue(R('quiz'), snap=>{
    const d=normQuiz(snap.val());
    if(S.isHost && !first && S.quiz) return; // 감독관 화면은 자기 편집본이 기준
    if(S.isHost && !d){ if(!S.quiz){ const s=sampleQuiz(); S.quiz=s.quiz; S.key=s.key; } }
    else S.quiz=d;
    if(first && S.isHost && d){ FB.get(R('key')).then(k=>{ S.key={...(k.val()?.answers||{})}; render(); }).catch(()=>{}); }
    first=false; S.loading=false; S.quizLoaded=true; clearTimeout(timer);
    phaseChanged(); render();
  }, err=>{ S.loading=false; S.fatal='데이터를 읽지 못했어요. Realtime Database 보안 규칙을 확인해 주세요. ('+err.code+')'; render(); });
  FB.onValue(R('images'), snap=>{ S.images=snap.val()||{}; render(); }, ()=>{});
  FB.onValue(R('results'), snap=>{
    const v=snap.val(); S.results = v ? {...v, entries:normEntries(v.entries), key:v.key||{}} : null;

}

function phaseChanged(){

}

/* ---------------- host persistence ---------------- */
let saveT=null;
function scheduleSave(){ if(S.local) return; clearTimeout(saveT); saveT=setTimeout(saveQuiz,600); }
async function saveQuiz(){
  if(S.local) return;
  try{
    await FB.set(R('quiz'), JSON.parse(JSON.stringify(S.quiz)));
    await FB.set(R('key'), {answers:S.key});
  }catch(e){ S.hostMsg='저장하지 못했어요. 보안 규칙의 감독관 UID가 지금 로그인한 계정과 같은지 확인해 주세요.'; renderBar(); }
}
async function setPhase(ph){ S.quiz.phase=ph; clearTimeout(saveT); await saveQuiz(); phaseChanged(); render(); }
function mergedEntries(){ const m={}; for(const [id,e] of Object.entries(S.subs)) if(e.nick) m[id]=e; return m; }
async function writeResults(v){ if(S.local) S.results=v; else if(v===null) await FB.remove(R('results')); else await FB.set(R('results'),v); }
const normTxt = v => String(v ?? '').normalize('NFC').toLowerCase().replace(/\s+/g,'');
const kwList = k => (Array.isArray(k) ? k : (k && typeof k==='object' ? Object.values(k) : [])).map(String).filter(x=>x.trim());
function matchText(answer, key){ const a=normTxt(answer); return !!a && kwList(key).some(k=>{ const kk=normTxt(k); return kk && a.includes(kk); }); }
function answered(e,q){ return q.type==='game' ? e.gm?.[q.id]!==undefined : (e.ans?.[q.id]!==undefined && e.ans?.[q.id]!==''); }
function validateQuiz(){
  const qs=S.quiz.questions;
  if(!qs.length) return '문제를 1개 이상 만들어 주세요.';
  for(let i=0;i<qs.length;i++){ const q=qs[i];
    if(q.type==='choice' && (S.key[q.id]===undefined || !q.text.trim() || q.options.some((o,k)=>!o.trim() && !q.optImgs?.[k]))) return `${i+1}번 문제의 지문, 보기 5개(글이나 사진), 정답을 모두 채워 주세요.`;
    if(q.type==='text' && (!q.text.trim() || !kwList(S.key[q.id]).length)) return `${i+1}번 주관식 문제의 지문과 정답 단어를 채워 주세요.`;
  }
  return '';
}
function gradeAll(base){
  const qs=S.quiz.questions; let total=0; qs.forEach(q=>total+=Number(q.points)||0);
  const entries={};
  for(const [id,e] of Object.entries(base||{})){
    let score=0; const marks={};
    qs.forEach(q=>{
      const ok = q.type==='game' ? (Number(e.gm?.[q.id])||0) >= (Number(q.target)||0)
               : q.type==='text' ? matchText(e.ans?.[q.id], S.key[q.id])
               : e.ans?.[q.id]===S.key[q.id];
      marks[q.id]=ok?1:0; if(ok) score+=Number(q.points)||0;
    });
    entries[id]={...e,score,marks};
  }
  return {graded:true,entries,key:S.key,total,gradedAt:Date.now()};
}
async function goPhase(t){
  const cur=S.quiz.phase; if(t===cur) return;
  if(cur==='draft' && t!=='draft'){ const m=validateQuiz(); if(m){ S.hostMsg=m; return; } delete S.quiz.example; }
  if(t==='draft'){ await writeResults(null); S.viewPid=null; S.hostTab='edit'; await setPhase('draft'); }
  if(t==='open'){ await writeResults(null); S.viewPid=null; await setPhase('open'); }
  if(t==='closed'){
    if(cur==='graded'){ const entries={}; for(const [id,e] of Object.entries(S.results?.entries||{})){ const {score,marks,...rest}=e; entries[id]=rest; } await writeResults({graded:false,entries}); await setPhase('closed'); }
    else { await setPhase('closed'); await writeResults({graded:false,entries:mergedEntries(),closedAt:Date.now()}); } // 먼저 잠가서 응시자 쓰기를 막음
  }
  if(t==='graded'){
    let base;
    if(cur==='closed') base=S.results?.entries||mergedEntries();
    else { await setPhase('closed'); base=mergedEntries(); }
    S.wasGraded=false;
    await writeResults(gradeAll(base));
    await setPhase('graded');
  }
}
async function hostAction(act){
  S.hostMsg='';
  try{
    if(act==='asviewer'){ S.isHost=false; render(); return; }
    if(act==='logout'){ await FB.signOut(S.auth); location.reload(); return; }
    if(act.startsWith('go:')) await goPhase(act.slice(3));
    if(act==='next'){ const i=PHASES.findIndex(p=>p[0]===S.quiz.phase); if(i<PHASES.length-1) await goPhase(PHASES[i+1][0]); }
    if(act==='prev'){ const i=PHASES.findIndex(p=>p[0]===S.quiz.phase); if(i>0) await goPhase(PHASES[i-1][0]); }
    if(act==='reset'){
      if(S.confirm!=='reset'){ S.confirm='reset'; S.hostMsg='한 번 더 누르면 응시자 답안과 채점 결과를 모두 지우고 출제 단계로 돌아갑니다. 문제는 남아 있어요.'; return renderBar(); }
      S.confirm=null;
      if(!S.local){ await FB.remove(R('results')); await FB.remove(R('subs')); }
      S.subs={}; S.results=null; S.viewPid=null; S.hostTab='edit';
      await setPhase('draft');
    }
  }catch(e){ S.hostMsg='처리하지 못했어요: '+(e?.message||e?.code||'알 수 없는 오류'); }
  if(act!=='reset') S.confirm=null;
  renderBar();
}

/* ---------------- question images ---------------- */
async function shrinkImage(file,maxSide){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=url; });
    let max=maxSide||1100, q=0.82, out='';
    for(let tries=0; tries<5; tries++){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      out=c.toDataURL('image/jpeg',q);
      if(out.length<450000) break;
      max=Math.round(max*0.8); q=Math.max(0.6,q-0.08);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
async function uploadImage(file,max){
  if(!file || !file.type.startsWith('image/')){ S.hostMsg='사진 파일(JPG, PNG 등)만 넣을 수 있어요.'; renderBar(); return null; }
  S.hostMsg='사진을 줄이는 중…'; renderBar();
  let data;
  try{ data=await shrinkImage(file,max); }catch(e){ S.hostMsg='이 사진은 열 수 없어요. 다른 파일로 해 주세요.'; renderBar(); return null; }
  const id='i'+Math.random().toString(36).slice(2,9);
  try{
    if(!S.local) await FB.set(R('images/'+id),data);
    S.images={...S.images,[id]:data}; S.hostMsg='';
    return id;
  }catch(e){ S.hostMsg='사진을 저장하지 못했어요. 보안 규칙에 images 항목이 있는지 확인해 주세요.'; renderBar(); return null; }
}

  const old=qq.img; qq.img=id; scheduleSave(); if(old) removeImage(old); render();

async function setOptionImage(qq,k,file){
  const id=await uploadImage(file,640); if(!id) return;

function renderBar(){

  let roster='';

    const src = S.results?.entries || mergedEntries();

  const ph=S.quiz?.phase;
  if(S.isHost) {
    if(S.local) return `<div class="notice">Firebase 설정값이 아직 없어서 저장 없는 미리보기로 열렸어요. 설정을 마치면 시청자에게는 감독관 바 없이 응시자 화면만 보여요. 위쪽 '시청자 화면 보기'로 미리 확인할 수 있어요.</div>`;
    return '';
  }
  let t='';
  if(ph==='open'){
    if(!S.nick.trim()) t='<b>성명란에 닉네임을 먼저 적어 주세요.</b> 그다음 답을 고를 수 있어요.';
    else if(S.saveErr) t='<b>답안을 저장하지 못했어요.</b> 인터넷 연결을 확인하거나 감독관이 마감했는지 확인해 주세요.';
    else if(S.saved) t=`답안이 자동 제출되었습니다 · ${S.saved.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
    else t='답을 고르면 자동으로 제출돼요. 감독관이 마감하기 전까지 고칠 수 있습니다.';
  }
  if(ph==='closed') t='<b>답안이 마감되었습니다.</b> 채점을 기다리는 중이에요.';
  if(ph==='graded') t= S.results?.entries?.[S.me] ? '채점이 끝났습니다.' : '채점이 끝났습니다. 아래 성적표에서 다른 응시자의 답안지를 볼 수 있어요.';
  return `<div class="status" id="status">${t}</div>`;
}
function statusUpdate(){ const s=$('#status'); if(s){ const tmp=document.createElement('div'); tmp.innerHTML=statusLine(); s.replaceWith(tmp.firstElementChild||document.createTextNode('')); } }

function ranking(){
  const r=S.results; if(!r?.graded) return '';
  const rows=Object.entries(r.entries||{}).sort((a,b)=>b[1].score-a[1].score || a[1].nick.localeCompare(b[1].nick));
  let rank=0, prev=null;
  const cur=viewedEntry()?.id;
  const trs=rows.map(([id,e],i)=>{ if(e.score!==prev){rank=i+1;prev=e.score;}
    const ok=Object.values(e.marks||{}).filter(Boolean).length;
    return `<tr class="${id===cur?'sel':''}"><td>${rank}</td><td class="nm">${esc(e.nick)}${id===S.me?' (나)':''}</td><td class="sc">${e.score}점</td><td>${ok}/${S.quiz.questions.length}문항</td><td><button class="linkbtn" data-view="${esc(id)}">답안지 보기</button></td></tr>`;
  }).join('');
  return `<section class="ranking"><h2>성적 일람표 <small>응시자 ${rows.length}명 · 총점 ${r.total}점</small></h2>
    <div class="rank-wrap"><table><thead><tr><th>석차</th><th>성명</th><th>점수</th><th>맞힌 문항</th><th></th></tr></thead><tbody>${trs||'<tr><td colspan="5">응시자가 없어요.</td></tr>'}</tbody></table></div></section>
    <div class="viewing">${cur?`<span>지금 보는 답안지: <b>${esc(r.entries[cur].nick)}</b></span> <button class="linkbtn" data-view="__key">정답지로 보기</button>`:'<span>지금 보는 화면: <b>정답지</b></span>'}</div>`;
}

function renderSheet(){
  const ae=document.activeElement, fid=ae&&ae.id&&ae.closest&&ae.closest('#sheet')?ae.id:null;
  let sel=null; try{ if(fid && typeof ae.selectionStart==='number') sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){}
  renderSheetInner();
  if(fid){ const n=document.getElementById(fid); if(n && n!==ae && !n.disabled){ n.focus({preventScroll:true}); try{ if(sel) n.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
}
function renderSheetInner(){
  const sh=$('#sheet');
  if(S.loading){ sh.innerHTML=`<div class="empty"><h2>시험지를 불러오는 중…</h2>${S.slow?'<p>연결이 늦어지고 있어요. 잠시만 기다려 주세요.</p>':''}</div>`; return; }
  if(S.fatal){ sh.innerHTML=header0()+`<div class="empty"><h2>연결 설정을 확인해 주세요</h2><p>${esc(S.fatal)}</p></div>`; return; }
  const q=S.quiz;
  if(!q){ sh.innerHTML=header0()+`<div class="empty"><h2>아직 시험지가 배부되지 않았습니다</h2><p>감독관이 시험을 시작하면 이 화면에 문제가 나타나요.</p></div>`+footer(); return; }
  if(!S.isHost && q.phase==='draft'){ sh.innerHTML=header()+`<div class="empty"><h2>시험 시작 전입니다</h2><p>성명란에 닉네임을 적고 기다려 주세요. 감독관이 시험을 시작하면 문제가 나타나요.</p></div>`+footer(); bindHeader(); return; }
  if(S.isHost && q.phase==='draft' && S.hostTab==='edit'){ sh.innerHTML=header()+editor()+footer(); bindHeader(); bindEditor(); return; }
  sh.innerHTML = header() + ranking() + `<div class="qs ${S.reveal?'reveal':''}" id="qs"></div>` + footer();
  const qs=$('#qs'); q.questions.forEach((qq,i)=>qs.appendChild(questionEl(qq,i)));
  bindHeader();
  S.reveal=false;
}
function header0(){ return `<header><div class="head-top"><span>2026학년도 빼빼로데이 특별 모의평가 문제지</span><span class="form-type">홀수형</span></div><div class="head-title"><span class="period">제 1 교시</span><h1 class="subject">빼빼로 영역</h1><span class="sticks" aria-hidden="true"><i class="stick"></i><i class="stick"></i></span></div></header>`; }
function footer(){ return loginBox()+`<div class="foot"><span>이 문제지에 관한 저작권은 빼빼로데이 출제위원회에 있습니다.</span><span class="pageno">1</span><span>11월 11일 시행</span></div>`; }

function bindHeader(){
  const n=$('#nick'); if(!n||n.disabled) return;
  n.addEventListener('input',()=>{ S.nick=n.value.trim(); ls.set('pp-nick',S.nick); statusUpdate(); });
  n.addEventListener('change',()=>{ if(S.quiz?.phase==='open'){ pushAnswers(); } render(); });
  $('#sheet').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ S.viewPid=b.dataset.view==='__key'?'__key':b.dataset.view; render(); });
}

/* one question on the paper */
function questionEl(q,i){
  const ph=S.quiz.phase; const r=S.results;
  const graded = ph==='graded' && r?.graded;
  const ent = (ph==='closed'||graded) ? viewedEntry() : null;
  const host=S.isHost;
  const key = graded ? r.key : (host ? S.key : {});
  // whose answers to show
  let ans, gm;
  if(ent){ ans=ent.ans||{}; gm=ent.gm||{}; }
  else if(host || (graded && S.viewPid==='__key')){ ans={}; gm={}; }
  else if(graded && !r.entries?.[S.me]){ ans={}; gm={}; }
  else { ans=S.ans; gm=S.gm; }
  const canAnswer = !host && ph==='open' && !!S.nick.trim();
  // stats for host
  let counts=null;
  if(host && ph!=='draft'){ counts=[0,0,0,0,0]; const src=r?.entries||mergedEntries(); Object.values(src).forEach(e=>{ const a=e.ans?.[q.id]; if(a!==undefined) counts[a]++; }); }

  const el=document.createElement('article'); el.className='q'; el.style.setProperty('--i',i);
  let mark='';
  if(graded && ent){ const ok=ent.marks?.[q.id]; mark=`<span class="mark ${ok?'ok':'no'}" aria-label="${ok?'정답':'오답'}"></span>`; }
  el.innerHTML=`<div class="q-line"><span class="q-num">${mark}${i+1}.</span><div class="q-text">${esc(q.text)} <span class="pts">[${Number(q.points)||0}점]</span></div></div>${imgHtml(q)}`;
  if(q.type==='choice'){
    const ol=document.createElement('ol'); const hasImg=(q.optImgs||[]).some(Boolean); ol.className='opts'+(hasImg?' has-img':'');
    q.options.forEach((o,k)=>{
      const li=document.createElement('li');
      const isKey = key && key[q.id]===k && (graded || host);
      li.innerHTML=`<button class="opt ${ans[q.id]===k?'on':''} ${isKey?'key':''}" ${canAnswer?'':'disabled'} aria-pressed="${ans[q.id]===k}"><span class="circ">${NUMS[k]}</span><span class="opt-txt">${q.optImgs?.[k] ? (S.images[q.optImgs[k]] ? `<img class="opt-img" src="${S.images[q.optImgs[k]]}" alt="${k+1}번 보기 사진">` : '<span class="opt-wait">사진 불러오는 중…</span>') : ''}${o?`<span>${esc(o)}</span>`:''}</span>${counts?`<span class="cnt">${counts[k]}명</span>`:''}</button>`;
      li.firstElementChild.onclick=()=>{ if(!canAnswer) return; S.ans[q.id]=k; ol.querySelectorAll('.opt').forEach((b,j)=>{b.classList.toggle('on',j===k);b.setAttribute('aria-pressed',j===k);}); pushAnswers(); };
      ol.appendChild(li);
    });
    el.appendChild(ol);
  } else if(q.type==='text'){
    const wrap=document.createElement('div'); wrap.className='sa';
    const showKey = graded || host;
    const kws = kwList(graded ? r.key?.[q.id] : S.key[q.id]);
    if(host && !ent && ph!=='draft'){
      const src=r?.entries||mergedEntries(); const list=Object.values(src);
      const n=list.filter(e=>answered(e,q)).length;
      const okN = graded ? list.filter(e=>e.marks?.[q.id]).length : list.filter(e=>matchText(e.ans?.[q.id],S.key[q.id])).length;
      wrap.innerHTML=`<div class="sa-line"><span class="sa-lbl">답</span><span class="sa-stat">응답 ${n}명 · 정답 ${okN}명</span></div>`;
    } else {
      const val=String(ans[q.id]??'');
      wrap.innerHTML=`<label class="sa-line"><span class="sa-lbl">답</span><input class="sa-in" id="sa-${q.id}" maxlength="100" autocomplete="off" placeholder="${canAnswer?'여기에 답을 쓰세요':''}" ${canAnswer?'':'disabled'}></label>`;
      const inp=wrap.querySelector('input'); inp.value=val;
      inp.addEventListener('input',()=>{ if(!canAnswer) return; S.ans[q.id]=inp.value.slice(0,100); pushAnswers(); });
    }
    if(showKey && kws.length) wrap.insertAdjacentHTML('beforeend',`<div class="sa-key">정답 단어: ${kws.map(k=>`<b>${esc(k)}</b>`).join(', ')} <span>(이 단어가 들어가면 정답)</span></div>`);
    el.appendChild(wrap);
  } else {
    const g=GAMES[q.game]||GAMES.catch;
    const best = gm[q.id];
    if(ph==='closed'||graded){
      const d=document.createElement('div'); d.className='game-res';
      if(host && !ent){ const src=r?.entries||{}; const vals=Object.values(src).map(e=>e.gm?.[q.id]).filter(v=>v!==undefined); const pass=vals.filter(v=>v>=q.target).length; d.textContent=`${g.name} · 목표 ${q.target}${g.unit} · 달성 ${pass}명 / 기록 제출 ${vals.length}명`; }
      else d.innerHTML=`${g.name} · 목표 <b>${q.target}${g.unit}</b> · ${ent||ph==='closed'?`기록 <b>${best??'없음'}${best!==undefined?g.unit:''}</b>`:'정답지에는 기록이 없어요'}`;
      el.appendChild(d);
    } else {
      el.appendChild(gameBox(q, {
        best, playable: host || canAnswer, test: host,
        lockedMsg: !S.nick.trim() ? '닉네임을 적으면 플레이할 수 있어요' : '지금은 플레이할 수 없어요',
        onScore: sc => { if(host) return; if(best===undefined || sc>best){ S.gm[q.id]=sc; pushAnswers(); } }
      }));
    }
  }
  return el;
}

/* ---------------- editor ---------------- */
function editor(){
  const q=S.quiz; const total=q.questions.reduce((s,x)=>s+(Number(x.points)||0),0);
  return `<div class="ed-meta"><label>영역 이름 <input type="text" id="ed-title" value="${esc(q.title)}" maxlength="30"></label>${q.example?'<span class="example">예시 문제 · 자유롭게 고치거나 지우세요</span>':''}</div>
  <div class="ed-list" id="ed-list">${q.questions.map(edCard).join('')}</div>
  <div class="ed-sum"><span>총 ${q.questions.length}문항 · 총점 ${total}점</span><button class="ibtn" id="ed-even">배점을 100점에 맞추기</button></div>
  <div style="display:grid;gap:8px;margin-top:12px"><button class="ed-add" id="ed-add">+ 객관식 문제 추가</button><button class="ed-add" id="ed-addt">+ 주관식 문제 추가</button><button class="ed-add" id="ed-addg">+ 미니게임 문제 추가</button></div>`;
}
function edCard(q,i){
  const n=S.quiz.questions.length;
  const body = q.type==='text'
    ? `<label class="ed-kw"><span>정답 단어</span><input type="text" id="kw-${q.id}" data-f="kw" value="${esc(kwList(S.key[q.id]).join(', '))}" placeholder="예: 빼빼로, pepero"></label>
       <span class="hint">응시자가 쓴 답 어디에든 이 단어가 들어가면 정답이에요. 띄어쓰기와 영어 대소문자는 무시해요. 쉼표로 여러 개를 적으면 그중 하나만 들어가도 정답이에요.</span>`
    : q.type==='choice'
    ? q.options.map((o,k)=>`<div class="ed-opt"><label><input type="radio" name="k-${q.id}" data-f="key" data-k="${k}" ${S.key[q.id]===k?'checked':''}> 정답</label><span class="circ">${NUMS[k]}</span><input type="text" id="o-${q.id}-${k}" data-f="opt" data-k="${k}" value="${esc(o)}" placeholder="${q.optImgs?.[k]?'설명 (선택)':'보기 '+(k+1)}">${q.optImgs?.[k] && S.images[q.optImgs[k]] ? `<img class="ed-oimg" src="${S.images[q.optImgs[k]]}" alt="">` : ''}<span class="ed-img"><label class="ibtn" for="oi-${q.id}-${k}" title="${k+1}번 보기에 사진 넣기">${q.optImgs?.[k]?'바꾸기':'사진'}</label><input type="file" id="oi-${q.id}-${k}" accept="image/*" data-f="optimg" data-k="${k}"></span>${q.optImgs?.[k]?`<button class="ibtn del" data-optimgdel="${k}" aria-label="${k+1}번 보기 사진 빼기">✕</button>`:''}</div>`).join('')
      + `<span class="hint">정답 라디오를 눌러 정답을 표시하세요. 보기마다 '사진'으로 그림을 넣을 수 있고, 사진만 있으면 글은 비워도 돼요.</span>`
    : `<div class="ed-top"><label>게임 <select data-f="game">${Object.entries(GAMES).map(([k,g])=>`<option value="${k}" ${q.game===k?'selected':''}>${g.name}</option>`).join('')}</select></label>
       <label>목표 <input type="number" min="0" data-f="target" value="${q.target}"> ${GAMES[q.game].unit} 이상이면 정답</label></div>
       <span class="hint">${GAMES[q.game].desc}</span><div class="ed-game" data-game="${q.id}"></div>`;
  return `<div class="ed" data-q="${q.id}">
    <div class="ed-top"><span class="no">${i+1}.</span>
      <label>유형 <select data-f="type"><option value="choice" ${q.type==='choice'?'selected':''}>객관식 (5지선다)</option><option value="text" ${q.type==='text'?'selected':''}>주관식 (단어 포함)</option><option value="game" ${q.type==='game'?'selected':''}>미니게임</option></select></label>
      <label>배점 <input type="number" min="0" data-f="points" value="${q.points}"> 점</label>
      <span class="sp"><button class="ibtn" data-mv="-1" ${i===0?'disabled':''} aria-label="위로">↑</button><button class="ibtn" data-mv="1" ${i===n-1?'disabled':''} aria-label="아래로">↓</button><button class="ibtn del" data-del>삭제</button></span>
    </div>
    <textarea id="t-${q.id}" data-f="text" placeholder="문제 지문을 적으세요">${esc(q.text)}</textarea>
    <div class="ed-img">${q.img && S.images[q.img] ? `<img src="${S.images[q.img]}" alt="">` : ''}
      <label class="ibtn" for="f-${q.id}">${q.img?'사진 바꾸기':'+ 사진 넣기 (선택)'}</label><input type="file" id="f-${q.id}" accept="image/*" data-f="img">
      ${q.img?'<button class="ibtn del" data-imgdel>사진 빼기</button>':'<span class="hint">필요한 문제에만 넣으세요. 큰 사진은 자동으로 줄여요.</span>'}</div>
    ${body}
  </div>`;
}
function newQ(type){ const id=uid(); if(type==='text') return {id,type:'text',points:10,text:''}; return type==='game' ? {id,type:'game',points:10,text:'다음 미니게임에서 목표 기록을 달성하시오.',game:'catch',target:15} : {id,type:'choice',points:10,text:'',options:['','','','',''],optImgs:['','','','','']}; }
function bindEditor(){
  const q=S.quiz;
  $('#ed-title').oninput=e=>{ q.title=e.target.value; $('.subject').textContent=q.title||'빼빼로 영역'; scheduleSave(); };
  $('#ed-add').onclick=()=>{ q.questions.push(newQ('choice')); scheduleSave(); render(); };
  $('#ed-addt').onclick=()=>{ q.questions.push(newQ('text')); scheduleSave(); render(); };
  $('#ed-addg').onclick=()=>{ q.questions.push(newQ('game')); scheduleSave(); render(); };
  $('#ed-even').onclick=()=>{ const n=q.questions.length; if(!n) return; const base=Math.floor(100/n); let rem=100-base*n; q.questions.forEach((x,i)=>x.points=base+(i>=n-rem?1:0)); scheduleSave(); render(); };
  const list=$('#ed-list');
  list.addEventListener('input',e=>{
    const card=e.target.closest('[data-q]'); if(!card) return; const qq=q.questions.find(x=>x.id===card.dataset.q); const f=e.target.dataset.f;
    if(f==='text') qq.text=e.target.value;
    if(f==='opt') qq.options[+e.target.dataset.k]=e.target.value;
    if(f==='points'){ qq.points=Math.max(0,Number(e.target.value)||0); updSum(); }
    if(f==='target') qq.target=Math.max(0,Number(e.target.value)||0);
    if(f==='kw') S.key[qq.id]=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);
    scheduleSave();
  });
  list.addEventListener('change',e=>{
    const card=e.target.closest('[data-q]'); if(!card) return; const qq=q.questions.find(x=>x.id===card.dataset.q); const f=e.target.dataset.f;
    if(f==='key'){ S.key[qq.id]=+e.target.dataset.k; scheduleSave(); }
    if(f==='img'){ const file=e.target.files?.[0]; e.target.value=''; setQuestionImage(qq,file); }
    if(f==='optimg'){ const file=e.target.files?.[0]; e.target.value=''; setOptionImage(qq,+e.target.dataset.k,file); }
    if(f==='type'){ const nq=newQ(e.target.value); nq.id=qq.id; if(qq.img) nq.img=qq.img; (qq.optImgs||[]).forEach(id=>{ if(id) removeImage(id); }); nq.points=qq.points; nq.text=qq.text||nq.text; Object.keys(qq).forEach(k=>delete qq[k]); Object.assign(qq,nq); delete S.key[qq.id]; scheduleSave(); render(); }
    if(f==='game'){ qq.game=e.target.value; qq.target=GAMES[qq.game].def; scheduleSave(); render(); }
  });
  list.addEventListener('click',e=>{
    const card=e.target.closest('[data-q]'); if(!card) return; const i=q.questions.findIndex(x=>x.id===card.dataset.q);
    const od=e.target.closest('[data-optimgdel]');
    if(od){ const qq=q.questions[i]; const k=+od.dataset.optimgdel; const id=qq.optImgs?.[k]; if(id){ qq.optImgs[k]=''; removeImage(id); } scheduleSave(); render(); return; }
    if(e.target.closest('[data-imgdel]')){ const qq=q.questions[i]; const id=qq.img; delete qq.img; if(id) removeImage(id); scheduleSave(); render(); return; }
    if(e.target.closest('[data-del]')){ const [r]=q.questions.splice(i,1); delete S.key[r.id]; dropQuestionImages(r); scheduleSave(); render(); }
    const mv=e.target.closest('[data-mv]'); if(mv){ const j=i+Number(mv.dataset.mv); [q.questions[i],q.questions[j]]=[q.questions[j],q.questions[i]]; scheduleSave(); render(); }
  });
  list.querySelectorAll('[data-game]').forEach(slot=>{
    const qq=q.questions.find(x=>x.id===slot.dataset.game);
    slot.appendChild(gameBox(qq,{playable:true,test:true}));
  });
  function updSum(){ const total=q.questions.reduce((s,x)=>s+(Number(x.points)||0),0); $('.ed-sum span').textContent=`총 ${q.questions.length}문항 · 총점 ${total}점`; }
}

/* ---------------- mini games ---------------- */
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function gameBox(q,opt){
  const g=GAMES[q.game]||GAMES.catch;
  const box=document.createElement('div'); box.className='game';
  box.innerHTML=`<div class="game-head"><span><b>${g.name}</b> · ${esc(g.desc)}</span><span>목표 <b>${q.target}${g.unit}</b></span></div>
    <canvas tabindex="0" aria-label="${g.name} 게임 화면"></canvas>
    <div class="game-foot"><button class="gbtn">${opt.playable?'게임 시작':'잠김'}</button><button class="gbtn ghost act" hidden>${q.game==='timing'?'멈춰! (스페이스)':'두드리기 (스페이스)'}</button><span class="rec"></span></div>`;
  const cv=box.querySelector('canvas'), start=box.querySelector('.gbtn'), act=box.querySelector('.act'), rec=box.querySelector('.rec');
  let best=opt.best;
  const showRec=()=>{ rec.innerHTML = opt.test ? '감독관 시험 플레이 · 기록은 저장되지 않아요' : !opt.playable ? esc(opt.lockedMsg) : best!==undefined ? `내 최고 기록 <b>${best}${g.unit}</b> ${best>=q.target?'· 목표 달성':'· 다시 도전할 수 있어요'}` : '여러 번 도전할 수 있고, 최고 기록이 제출돼요.'; };
  showRec();
  start.disabled=!opt.playable;
  let ctx, W, H;
  const fit=()=>{ const r=cv.getBoundingClientRect(); const d=window.devicePixelRatio||1; W=r.width||300; H=r.height||210; cv.width=W*d; cv.height=H*d; ctx=cv.getContext('2d'); ctx.setTransform(d,0,0,d,0,0); };
  const idle=()=>{ fit(); const C=colors(); ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,H); drawStick(ctx,W/2-30,H/2-40,0.4,C); drawStick(ctx,W/2+18,H/2-44,-0.2,C); ctx.fillStyle=C.ink2; ctx.font='13px '+css('--f-ui'); ctx.textAlign='center'; ctx.fillText(opt.playable?'게임 시작을 누르세요':'',W/2,H-18); };
  requestAnimationFrame(idle);
  start.onclick=()=>{
    if(S.gameRunning) return; S.gameRunning=true; start.disabled=true; fit(); cv.focus();
    const runner={catch:runCatch,timing:runTiming,tap:runTap}[q.game]||runCatch;
    if(q.game!=='catch'){ act.hidden=false; }
    runner(cv,ctx,W,H,act,score=>{
      S.gameRunning=false; start.disabled=false; start.textContent='다시 하기'; act.hidden=true;
      if(!opt.test && (best===undefined||score>best)) best=score;
      opt.onScore && opt.onScore(score);
      rec.innerHTML = `이번 기록 <b>${score}${g.unit}</b> · ` + (opt.test?'시험 플레이':'최고 '+best+g.unit);
      setTimeout(()=>{ if(S.pendingRender){S.pendingRender=false; render();} else showRec(); },1800);
    });
  };
  return box;
}
function colors(){ return {paper:css('--paper'),ink:css('--ink'),ink2:css('--ink-2'),red:css('--red'),choco:css('--choco'),bis:css('--biscuit'),faint:css('--faint'),pink:css('--pink')}; }
function drawStick(c,x,y,rot,C,len=70,broken=false){
  c.save(); c.translate(x,y); c.rotate(rot);
  c.lineCap='round';
  c.strokeStyle=C.bis; c.lineWidth=7; c.beginPath(); c.moveTo(0,len*0.78); c.lineTo(0,len); c.stroke();
  c.strokeStyle=broken?C.ink2:C.choco; c.beginPath(); c.moveTo(0,broken?len*0.45:0); c.lineTo(0,len*0.78); c.stroke();
  if(broken){ c.strokeStyle=C.ink2; c.beginPath(); c.moveTo(4,0); c.lineTo(-3,len*0.3); c.stroke(); }
  c.restore();
}
function hud(ctx,W,txt,C){ ctx.fillStyle=C.ink; ctx.font='600 14px '+css('--f-ui'); ctx.textAlign='left'; ctx.fillText(txt,10,20); }
function keyHandler(cv,fn){ const h=e=>fn(e); cv.addEventListener('keydown',h); return ()=>cv.removeEventListener('keydown',h); }

function runCatch(cv,ctx,W,H,act,done){
  const C=colors(); const T=15000; const t0=performance.now(); let last=t0, spawn=0, score=0, bx=W/2, items=[], keys={};
  const move=e=>{ const r=cv.getBoundingClientRect(); bx=Math.max(30,Math.min(W-30,e.clientX-r.left)); };
  cv.addEventListener('pointermove',move); cv.addEventListener('pointerdown',move);
  const un=keyHandler(cv,e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=e.type==='keydown';e.preventDefault();} });
  const up=e=>{ keys[e.key]=false; }; cv.addEventListener('keyup',up);
  const loop=now=>{
    const dt=Math.min(50,now-last); last=now; const el=now-t0;
    if(keys.ArrowLeft) bx=Math.max(30,bx-dt*0.5); if(keys.ArrowRight) bx=Math.min(W-30,bx+dt*0.5);
    spawn-=dt; if(spawn<=0){ spawn=380+Math.random()*260; items.push({x:15+Math.random()*(W-30),y:-60,v:0.12+Math.random()*0.1+el/T*0.12,bad:Math.random()<0.22,r:(Math.random()-.5)*.6}); }
    ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,H);
    items.forEach(it=>{ it.y+=it.v*dt; drawStick(ctx,it.x,it.y,it.r,C,46,it.bad); });
    items=items.filter(it=>{ const tip=it.y+40; if(tip>H-34 && tip<H-8 && Math.abs(it.x-bx)<34){ score+=it.bad?-2:1; if(score<0)score=0; return false; } return it.y<H; });
    ctx.fillStyle=C.red; ctx.fillRect(bx-32,H-26,64,20); ctx.fillStyle=C.paper; ctx.font='600 11px '+css('--f-ui'); ctx.textAlign='center'; ctx.fillText('바구니',bx,H-12);
    hud(ctx,W,`${score}개 · ${Math.ceil((T-el)/1000)}초`,C);
    if(el<T) requestAnimationFrame(loop); else { cv.removeEventListener('pointermove',move); cv.removeEventListener('pointerdown',move); cv.removeEventListener('keyup',up); un(); endScreen(ctx,W,H,`${score}개`,C); done(score); }
  };
  requestAnimationFrame(loop);
}
function runTiming(cv,ctx,W,H,act,done){
  const C=colors(); let round=0, total=0, t0=performance.now(), stopped=false, msg='', pos=0, results=[];
  const speed=()=>0.0011+round*0.00035;
  const stop=()=>{ if(stopped) return; stopped=true; const d=Math.abs(pos-0.5); const p=d<=0.02?20:Math.max(0,Math.round(20*(1-(d-0.02)/0.28))); total+=p; results.push(p); msg=`+${p}점`; setTimeout(()=>{ round++; stopped=false; t0=performance.now(); msg=''; if(round>=5){ cleanup(); endScreen(ctx,W,H,`${total}점`,C); done(total); } else requestAnimationFrame(loop); },700); };
  act.onclick=stop; cv.onpointerdown=stop;
  const un=keyHandler(cv,e=>{ if(e.type==='keydown'&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();stop();} });
  const cleanup=()=>{ act.onclick=null; cv.onpointerdown=null; un(); };
  const loop=now=>{
    if(!stopped) pos=(Math.sin((now-t0)*speed()*Math.PI)+1)/2;
    ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,H);
    const y=H/2+10, x0=24, x1=W-24, L=x1-x0;
    ctx.save(); ctx.translate(x0,y); ctx.lineCap='round';
    ctx.strokeStyle=C.choco; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(L*0.82,0); ctx.stroke();
    ctx.strokeStyle=C.bis; ctx.beginPath(); ctx.moveTo(L*0.82,0); ctx.lineTo(L,0); ctx.stroke(); ctx.restore();
    ctx.strokeStyle=C.red; ctx.setLineDash([4,4]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0+L*0.5,y-30); ctx.lineTo(x0+L*0.5,y+30); ctx.stroke(); ctx.setLineDash([]);
    const kx=x0+L*pos; ctx.fillStyle=C.ink; ctx.beginPath(); ctx.moveTo(kx,y+8); ctx.lineTo(kx-9,y-34); ctx.lineTo(kx+9,y-34); ctx.closePath(); ctx.fill();
    hud(ctx,W,`${Math.min(round+1,5)}/5회 · ${total}점`,C);
    ctx.fillStyle=C.ink2; ctx.font='12px '+css('--f-ui'); ctx.textAlign='left'; ctx.fillText(results.map(r=>r+'점').join('  '),10,H-12);
    if(msg){ ctx.fillStyle=C.red; ctx.font='34px '+css('--f-hand'); ctx.textAlign='center'; ctx.fillText(msg,W/2,y+60); }
    if(!stopped) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  // keep drawing during pause so result text shows
  const pauseDraw=()=>{ if(round<5){ if(stopped) loop(performance.now()); requestAnimationFrame(pauseDraw); } }; requestAnimationFrame(pauseDraw);
}
function runTap(cv,ctx,W,H,act,done){
  const C=colors(); const T=5000; let t0=null, n=0, shake=0;
  const tap=()=>{ if(t0===null) t0=performance.now(); n++; shake=1; };
  act.onclick=tap; cv.onpointerdown=tap;
  const un=keyHandler(cv,e=>{ if(e.type==='keydown'&&(e.code==='Space'||e.key==='Enter')&&!e.repeat){e.preventDefault();tap();} });
  const loop=now=>{
    const el=t0===null?0:now-t0;
    ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,H);
    shake*=0.82; const dx=(Math.random()-.5)*10*shake;
    const bw=Math.min(150,W*0.45), bh=90, bx=W/2-bw/2+dx, by=H/2-bh/2+6;
    ctx.fillStyle=C.red; ctx.fillRect(bx,by,bw,bh); ctx.fillStyle=C.pink; ctx.fillRect(bx,by+bh*0.62,bw,bh*0.2);
    for(let i=0;i<4;i++) drawStick(ctx,bx+22+i*((bw-44)/3),by-26-(i%2)*6,0,C,40);
    ctx.fillStyle=C.paper; ctx.font='600 15px '+css('--f-ui'); ctx.textAlign='center'; ctx.fillText('빼빼로',bx+bw/2,by+38);
    hud(ctx,W,t0===null?'두드리면 시작해요':`${n}회 · ${Math.max(0,(T-el)/1000).toFixed(1)}초`,C);
    if(el<T) requestAnimationFrame(loop); else { act.onclick=null; cv.onpointerdown=null; un(); endScreen(ctx,W,H,`${n}회`,C); done(n); }
  };
  requestAnimationFrame(loop);
}
function endScreen(ctx,W,H,txt,C){
  ctx.fillStyle=C.paper; ctx.globalAlpha=.86; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  ctx.fillStyle=C.red; ctx.font='52px '+css('--f-hand'); ctx.textAlign='center'; ctx.fillText(txt,W/2,H/2+12);
  ctx.fillStyle=C.ink2; ctx.font='13px '+css('--f-ui'); ctx.fillText('종료',W/2,H/2+40);
}

boot();
})();
</script>
</body>
